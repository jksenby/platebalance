<p-toast />
<app-auth-shell>
  <h1 class="page-title">Создать аккаунт</h1>

  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="form" novalidate>
    <label class="field">
      <span class="label">Имя</span>
      <input
        pInputText
        fluid
        type="text"
        formControlName="name"
        autocomplete="name"
        [invalid]="isInvalid('name')"
      />
      @if (isInvalid('name')) {
        <p-message severity="error" variant="simple" size="small">
          @if (registrationForm.controls.name.hasError('required')) {
            Укажите имя
          } @else {
            Минимум 2 символа
          }
        </p-message>
      }
    </label>

    <label class="field">
      <span class="label">Email</span>
      <input
        pInputText
        fluid
        type="email"
        formControlName="email"
        autocomplete="email"
        [invalid]="isInvalid('email')"
      />
      @if (isInvalid('email')) {
        <p-message severity="error" variant="simple" size="small">
          @if (registrationForm.controls.email.hasError('required')) {
            Укажите email
          } @else {
            Похоже, в адресе опечатка
          }
        </p-message>
      }
    </label>

    <label class="field">
      <span class="label">Пароль</span>
      <p-password fluid toggleMask [feedback]="false"
        formControlName="password"
        autocomplete="new-password"
        [invalid]="isInvalid('password')"
      />
      @if (isInvalid('password')) {
        <p-message severity="error" variant="simple" size="small">
          @if (registrationForm.controls.password.hasError('required')) {
            Придумайте пароль
          } @else {
            Минимум 8 символов
          }
        </p-message>
      }
    </label>

    <label class="field">
      <span class="label">Повторите пароль</span>
      <p-password fluid toggleMask [feedback]="false"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [invalid]="isInvalid('confirmPassword') || mismatch"
      />
      @if (isInvalid('confirmPassword')) {
        <p-message severity="error" variant="simple" size="small">Повторите пароль</p-message>
      } @else if (mismatch) {
        <p-message severity="error" variant="simple" size="small">Пароли не совпадают</p-message>
      }
    </label>

    <p-button fluid type="submit" label="Создать аккаунт" [loading]="loading()" />
  </form>

  <p class="form-footer">
    Уже есть аккаунт?
    <a routerLink="/login" class="link">Войти</a>
  </p>
</app-auth-shell>
