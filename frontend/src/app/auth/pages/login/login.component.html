<p-toast />
<app-auth-shell>
  <h1 class="page-title">Вход</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form" novalidate>
    <label class="field">
      <span class="label">Email</span>
      <input
        pInputText
        fluid
        type="email"
        formControlName="email"
        autocomplete="email"
        [invalid]="isInvalid('email')"
      />
      @if (isInvalid('email')) {
        <p-message severity="error" variant="simple" size="small">
          @if (loginForm.controls.email.hasError('required')) {
            Укажите email
          } @else {
            Похоже, в адресе опечатка
          }
        </p-message>
      }
    </label>

    <label class="field">
      <span class="label">Пароль</span>
      <p-password fluid toggleMask [feedback]="false"
        formControlName="password"
        autocomplete="current-password"
        [invalid]="isInvalid('password')"
      />
      @if (isInvalid('password')) {
        <p-message severity="error" variant="simple" size="small">
          @if (loginForm.controls.password.hasError('required')) {
            Введите пароль
          } @else {
            Минимум 8 символов
          }
        </p-message>
      }
    </label>

    <p-button fluid type="submit" label="Войти" [loading]="loading()" />
  </form>

  <p class="form-footer">
    Нет аккаунта?
    <a routerLink="/registration" class="link">Создать</a>
  </p>
</app-auth-shell>
