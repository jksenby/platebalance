<div class="page">
  <header class="topbar">
    <div class="inner">
      <app-brand />
      <nav class="nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="link">Сегодня</a>
        <a routerLink="/profile" routerLinkActive="active" class="link">Профиль</a>
      </nav>
      <p-button
        label="Выйти"
        icon="pi pi-sign-out"
        severity="secondary"
        text
        [loading]="loggingOut()"
        (onClick)="logout()"
      />
    </div>
  </header>

  <main class="content">
    <ng-content />
  </main>
</div>
