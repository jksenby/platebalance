@if (user(); as user) {
  <p-card>
    <div class="base-profile">
      <p-avatar [label]="initial()" shape="circle" size="xlarge" class="avatar" />
      <div class="info">
        <h1 class="page-title">{{ user.firstName }}</h1>
        <p class="muted email">{{ user.email }}</p>
      </div>
    </div>
  </p-card>
}
